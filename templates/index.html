<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Student Twin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===================================================== */
/* 👩‍💻 STUDENT 1 (Ajwan)
   UI Design + Layout + Input Form + General Styling
===================================================== */

:root{
  --primary:#4facfe;
  --secondary:#00c6ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f5f7fb;
}

.container{
  width:95%;
  max-width:1500px;
  margin:30px auto;
}

/* Top Bar (Logout) */
.top-bar{
  width:95%;
  margin:auto;
  text-align:right;
  margin-bottom:10px;
}

.logout-btn{
  width:auto;
  padding:10px 20px;
}

/* Layout */
.main{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:20px;
}

/* Cards */
.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  transition:0.3s;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card:hover{
  transform:translateY(-5px);
}

/* Titles */
.card h2{
  position:relative;
  padding-bottom:10px;
}

.card h2::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:60px;
  height:4px;
  background:linear-gradient(90deg,#ffd43b,#fab005);
  border-radius:10px;
}

/* Input Form */
.left{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.left input,
.left button,
.left select{
  width:85%;
}

.left input{
  margin-bottom:10px;
}

input, select{
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* Buttons */
button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  transform:scale(1.03);
}


/* ===================================================== */
/* 👩‍💻 STUDENT 2 (Osaima)
   Data Visualization + Charts + Stats + Progress UI
===================================================== */

/* Circle Progress */
.circle{
  width:160px;
  height:160px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:25px auto;
  font-size:24px;
  font-weight:bold;
  background: conic-gradient(#00c6ff 0deg, #eee 0deg);
  box-shadow: 0 0 20px rgba(0,198,255,0.3);
}

/* Stats */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#f9fafc;
  padding:10px;
  border-radius:15px;
  text-align:center;
}

/* Bottom Layout */
.bottom-section{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:20px;
  margin-top:25px;
}

/* Progress Bars */
.progress-section{
  background:white;
  padding:20px;
  border-radius:16px;
}

.progress-bar{
  height:10px;
  background:#eee;
  border-radius:10px;
  margin:10px 0;
  overflow:hidden;
}

.progress-bar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
}


/* ===================================================== */
/* 👩‍💻 STUDENT 3 (Afaf)
   Output + Recommendations + Feedback UI
===================================================== */

/* Quote Box */
.quote{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  padding:20px;
}

</style>
</head>

<body>

<!-- ================== TOP BAR ================== -->
<div class="top-bar">
  <button class="logout-btn" onclick="logout()">🚪 Logout</button>
</div>

<div class="container">
<div class="main">

<!-- ===================================================== -->
<!-- 👩‍💻 STUDENT 1 (Ajwan): INPUT SECTION -->
<!-- ===================================================== -->
<div class="card left">
<h2>📋 Your Daily Info</h2>

<input id="study" type="number" placeholder="📚 Study Hours">
<input id="sleep" type="number" placeholder="😴 Sleep Hours">

<select id="feel">
  <option value="good">😊 Good</option>
  <option value="okay">😐 Okay</option>
  <option value="tired">😴 Tired</option>
  <option value="stressed">😰 Stressed</option>
</select>

<input id="stress" type="number" min="1" max="10" placeholder="😰 Stress (1-10)">
<input id="focus" type="number" min="1" max="10" placeholder="🎯 Focus (1-10)">

<button onclick="analyze()">🚀 Analyze</button>
<button onclick="window.location.href='/history'">📊 View History</button>
</div>

<!-- ===================================================== -->
<!-- 👩‍💻 STUDENT 2 (Osaima): VISUALIZATION -->
<!-- ===================================================== -->
<div>

<div class="card">
<h2>🧠 Your Digital Twin</h2>

<div id="status">-</div>
<div id="level"></div>
<div id="trend"></div>

<div class="circle" id="circle">0%</div>

<div class="stats">
  <div class="stat" id="health">❤️ Health</div>
  <div class="stat" id="consistency">📅 Consistency</div>
  <div class="stat" id="balance">⚖️ Balance</div>
</div>

<!-- ===================================================== -->
<!-- 👩‍💻 STUDENT 3 (Afaf): RECOMMENDATIONS -->
<!-- ===================================================== -->
<div style="margin-top:20px;">
<h3>💡 Recommendations</h3>
<ul id="tips"></ul>
</div>

</div>

<div class="bottom-section">

<div class="progress-section">
<h3>📊 Daily Performance</h3>

<p>📚 Study</p>
<div class="progress-bar"><span id="bar1"></span></div>

<p>😴 Sleep</p>
<div class="progress-bar"><span id="bar2"></span></div>

<p>⚡️ Performance</p>
<div class="progress-bar"><span id="bar3"></span></div>

</div>

<!-- ===================================================== -->
<!-- 👩‍💻 STUDENT 3 (Afaf): MOTIVATION -->
<!-- ===================================================== -->
<div class="quote">
✨ "Small daily improvements lead to big results."
</div>

</div>

</div>
</div>
</div>

<script>

/* ===================================================== */
/* 👩‍💻 STUDENT 2 (Osaima)
   Data Handling + API + UI Updates
===================================================== */

function analyze(){

let data = {
  study: parseFloat(document.getElementById("study").value) || 0,
  sleep: parseFloat(document.getElementById("sleep").value) || 0,

  stress: Math.min(10, Math.max(1,
    parseFloat(document.getElementById("stress").value) || 1
  )),

  focus: Math.min(10, Math.max(1,
    parseFloat(document.getElementById("focus").value) || 1
  )),

  feeling: document.getElementById("feel").value
};

fetch("/analyze", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
})
.then(res => res.json())
.then(res => {

  let score = res.score;
  let circle = document.getElementById("circle");

  let deg = score * 3.6;
  let current = 0;

  let interval = setInterval(() => {
    if(current >= deg){
      clearInterval(interval);
    } else {
      current += 3;
      circle.style.background =
        'conic-gradient(#00c6ff ${current}deg, #eee ${current}deg)';
    }
  }, 10);

  let num = 0;
  let counter = setInterval(()=>{
    if(num >= score){
      clearInterval(counter);
    } else {
      num++;
      circle.innerText = num + "%";
    }
  }, 15);

  document.getElementById("status").innerText = res.profile;

  // LEVEL
  let levelEl = document.getElementById("level");
  levelEl.innerText = res.level || "No level";

  if (res.level && res.level.includes("Excellent")) {
    levelEl.style.color = "green";
  } else if (res.level && res.level.includes("Average")) {
    levelEl.style.color = "orange";
  } else {
    levelEl.style.color = "red";
  }

  // TREND
  let trendEl = document.getElementById("trend");
  trendEl.innerText = res.trend || "No trend";

  if (res.trend && res.trend.includes("Improving")) {
    trendEl.style.color = "green";
  } else if (res.trend && res.trend.includes("Declining")) {
    trendEl.style.color = "red";
  } else {
    trendEl.style.color = "gray";
  }

  document.getElementById("health").innerText =
    "❤️ " + (res.health || "N/A");

  document.getElementById("consistency").innerText ="📅 " + (res.consistency || "N/A");

  document.getElementById("balance").innerText =
    "⚖️ " + (res.balance || "N/A");

  let tipsList = document.getElementById("tips");
  tipsList.innerHTML = "";

  res.tips.forEach(t=>{
    let li = document.createElement("li");
    li.innerText = t;
    tipsList.appendChild(li);
  });

  document.getElementById("bar1").style.width = Math.min(100, data.study * 10) + "%";
  document.getElementById("bar2").style.width = Math.min(100, data.sleep * 10) + "%";
  document.getElementById("bar3").style.width = score + "%";

})
.catch(err=>{
  alert("Error connecting to server 😢");
});
}

/* ===================================================== */
/* 👩‍💻 SHARED (ALL STUDENTS): LOGOUT
===================================================== */

function logout(){
  window.location.href = "/logout";
}

</script>

</body>
</html>
